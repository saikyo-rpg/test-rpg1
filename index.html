<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>近づくと自動戦闘 - 最小サンプル</title>
  <style>
    body { margin: 0; background:#111; color:#eee; font-family: system-ui, sans-serif; }
    #wrap { display:flex; gap:12px; padding:12px; }
    canvas { background:#1a1a1a; border:1px solid #333; border-radius:10px; }
    #ui { width: 320px; }
    .card { background:#181818; border:1px solid #2a2a2a; border-radius:10px; padding:12px; margin-bottom:12px; }
    .bar { height:10px; background:#2a2a2a; border-radius:999px; overflow:hidden; }
    .bar > div { height:100%; background:#5fd38d; width:100%; }
    .bar.red > div { background:#ff6b6b; }
    #log { height: 240px; overflow:auto; font-size: 13px; line-height: 1.35; }
    .hint { font-size: 13px; opacity:.9; }
    kbd { background:#222; border:1px solid #333; border-bottom-color:#444; padding:2px 6px; border-radius:6px; }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="c" width="720" height="480"></canvas>
    <div id="ui">
      <div class="card">
        <div><b>操作</b></div>
        <div class="hint"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移動 / 敵に近づくと自動戦闘</div>
        <div class="hint">戦闘中は移動停止（サンプル簡略化）</div>
      </div>

      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <b>プレイヤー</b>
          <span id="pStat"></span>
        </div>
        <div class="bar"><div id="pBar"></div></div>
      </div>

      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <b>敵</b>
          <span id="eStat"></span>
        </div>
        <div class="bar red"><div id="eBar"></div></div>
        <div class="hint" id="battleState" style="margin-top:8px;"></div>
      </div>

      <div class="card">
        <b>ログ</b>
        <div id="log"></div>
      </div>
    </div>
  </div>

<script>
(() => {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");

  // ====== ゲーム定数 ======
  const WORLD = { w: canvas.width, h: canvas.height };
  const DT = 1/60; // 固定タイムステップ
  const MOVE_SPEED = 180; // px/sec
  const AGGRO_RADIUS = 70; // 近づくと戦闘開始する距離
  const HIT_RADIUS = 18;   // 当たり判定（簡易）
  const ATTACK_INTERVAL = 0.65; // sec
  const PLAYER = {
    x: 120, y: 240, r: 12,
    maxHp: 120, hp: 120,
    atkMin: 8, atkMax: 14,
    def: 2,
  };

  const ENEMIES = [
    makeEnemy(520, 160, "スライム", 80, 6, 11, 1),
    makeEnemy(560, 320, "ゴブリン", 110, 8, 14, 2),
  ];

  function makeEnemy(x, y, name, hp, atkMin, atkMax, def){
    return {
      x, y, r: 12,
      name,
      maxHp: hp, hp,
      atkMin, atkMax,
      def,
      alive: true
    };
  }

  // ====== 入力 ======
  const keys = new Set();
  window.addEventListener("keydown", (e) => keys.add(e.key.toLowerCase()));
  window.addEventListener("keyup",   (e) => keys.delete(e.key.toLowerCase()));

  // ====== 戦闘ステート ======
  let battle = {
    inBattle: false,
    target: null,          // enemy object
    pAttackTimer: 0,
    eAttackTimer: 0,
  };

  // ====== UI ======
  const elLog = document.getElementById("log");
  const elPBar = document.getElementById("pBar");
  const elEBar = document.getElementById("eBar");
  const elPStat = document.getElementById("pStat");
  const elEStat = document.getElementById("eStat");
  const elBattleState = document.getElementById("battleState");

  function log(msg){
    const div = document.createElement("div");
    div.textContent = msg;
    elLog.appendChild(div);
    elLog.scrollTop = elLog.scrollHeight;
  }

  function clamp(n, a, b){ return Math.max(a, Math.min(b, n)); }
  function dist(a,b){ return Math.hypot(a.x - b.x, a.y - b.y); }
  function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }

  // ====== ダメージ計算（超シンプル） ======
  function calcDamage(atkMin, atkMax, def){
    const raw = randInt(atkMin, atkMax);
    return Math.max(1, raw - def);
  }

  // ====== ループ ======
  let acc = 0;
  let last = performance.now();

  function frame(now){
    const dt = (now - last)/1000;
    last = now;
    acc += dt;

    // タブ非アクティブなどでaccが溜まりすぎないように
    acc = Math.min(acc, 0.25);

    while(acc >= DT){
      update(DT);
      acc -= DT;
    }
    render();
    requestAnimationFrame(frame);
  }

  function update(dt){
    // 死亡チェック
    if(PLAYER.hp <= 0){
      PLAYER.hp = 0;
      battle.inBattle = false;
      battle.target = null;
      return;
    }

    // 戦闘中は移動停止（サンプル簡略化）
    if(!battle.inBattle){
      // 移動
      let vx = 0, vy = 0;
      if(keys.has("w")) vy -= 1;
      if(keys.has("s")) vy += 1;
      if(keys.has("a")) vx -= 1;
      if(keys.has("d")) vx += 1;
      const len = Math.hypot(vx,vy) || 1;
      vx /= len; vy /= len;

      PLAYER.x = clamp(PLAYER.x + vx * MOVE_SPEED * dt, 20, WORLD.w - 20);
      PLAYER.y = clamp(PLAYER.y + vy * MOVE_SPEED * dt, 20, WORLD.h - 20);

      // 近づいた敵を探して戦闘開始（最初に範囲内に入った1体をターゲット）
      const target = ENEMIES.find(e => e.alive && dist(PLAYER, e) <= AGGRO_RADIUS);
      if(target){
        startBattle(target);
      }
    } else {
      // 戦闘処理
      const e = battle.target;
      if(!e || !e.alive){
        endBattle();
        return;
      }

      // もし離れたら戦闘解除（好みでON/OFF）
      if(dist(PLAYER, e) > AGGRO_RADIUS * 1.35){
        log(`距離が離れた！戦闘解除`);
        endBattle();
        return;
      }

      battle.pAttackTimer -= dt;
      battle.eAttackTimer -= dt;

      if(battle.pAttackTimer <= 0){
        battle.pAttackTimer += ATTACK_INTERVAL;
        const dmg = calcDamage(PLAYER.atkMin, PLAYER.atkMax, e.def);
        e.hp = Math.max(0, e.hp - dmg);
        log(`あなたの攻撃！ ${e.name} に ${dmg} ダメージ`);
        if(e.hp <= 0){
          e.alive = false;
          log(`${e.name} を倒した！`);
          endBattle();
          return;
        }
      }

      if(battle.eAttackTimer <= 0){
        battle.eAttackTimer += ATTACK_INTERVAL + 0.15; // 敵は少し遅め
        const dmg = calcDamage(e.atkMin, e.atkMax, PLAYER.def);
        PLAYER.hp = Math.max(0, PLAYER.hp - dmg);
        log(`${e.name} の攻撃！ あなたに ${dmg} ダメージ`);
        if(PLAYER.hp <= 0){
          log(`あなたは倒れた…`);
          return;
        }
      }
    }
  }

  function startBattle(enemy){
    battle.inBattle = true;
    battle.target = enemy;
    battle.pAttackTimer = 0.2;
    battle.eAttackTimer = 0.45;
    log(`⚔️ ${enemy.name} と戦闘開始！`);
  }

  function endBattle(){
    battle.inBattle = false;
    battle.target = null;
    battle.pAttackTimer = 0;
    battle.eAttackTimer = 0;
  }

  function render(){
    ctx.clearRect(0,0,WORLD.w,WORLD.h);

    // 背景グリッド
    ctx.globalAlpha = 0.12;
    ctx.strokeStyle = "#fff";
    for(let x=0;x<WORLD.w;x+=40){
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,WORLD.h); ctx.stroke();
    }
    for(let y=0;y<WORLD.h;y+=40){
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(WORLD.w,y); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // 敵
    for(const e of ENEMIES){
      if(!e.alive) continue;

      // アグロ範囲（薄い円）
      ctx.globalAlpha = 0.18;
      ctx.beginPath();
      ctx.arc(e.x, e.y, AGGRO_RADIUS, 0, Math.PI*2);
      ctx.fillStyle = "#ff6b6b";
      ctx.fill();
      ctx.globalAlpha = 1;

      // 本体
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r, 0, Math.PI*2);
      ctx.fillStyle = "#ff6b6b";
      ctx.fill();

      // 名前
      ctx.fillStyle = "#fff";
      ctx.font = "12px system-ui";
      ctx.textAlign = "center";
      ctx.fillText(e.name, e.x, e.y - 18);
    }

    // プレイヤー
    ctx.beginPath();
    ctx.arc(PLAYER.x, PLAYER.y, PLAYER.r, 0, Math.PI*2);
    ctx.fillStyle = "#5fd38d";
    ctx.fill();

    // ターゲット線
    if(battle.inBattle && battle.target){
      const e = battle.target;
      ctx.strokeStyle = "#fff";
      ctx.globalAlpha = 0.55;
      ctx.beginPath();
      ctx.moveTo(PLAYER.x, PLAYER.y);
      ctx.lineTo(e.x, e.y);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // UI更新
    elPStat.textContent = `${PLAYER.hp}/${PLAYER.maxHp}`;
    elPBar.style.width = `${(PLAYER.hp/PLAYER.maxHp)*100}%`;

    const e = battle.target && battle.target.alive ? battle.target : ENEMIES.find(x=>x.alive) || null;
    if(e){
      elEStat.textContent = `${e.hp}/${e.maxHp} (${e.name})`;
      elEBar.style.width = `${(e.hp/e.maxHp)*100}%`;
    } else {
      elEStat.textContent = `-`;
      elEBar.style.width = `0%`;
    }

    if(battle.inBattle && battle.target){
      elBattleState.textContent = `戦闘中：${battle.target.name}（範囲外に出ると解除）`;
    } else {
      elBattleState.textContent = `探索中：敵の赤い円に入ると自動戦闘`;
    }
  }

  // 初期ログ
  log("WASDで移動。敵の赤い円に入ると自動戦闘。");
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
