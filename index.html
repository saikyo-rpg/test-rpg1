<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>近づくと自動戦闘 - サンプル</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="wrap">
    <canvas id="c" width="720" height="480"></canvas>

    <div id="ui">
      <div class="card">
        <div><b>操作</b></div>
        <div class="hint"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移動</div>
        <div class="hint">赤＝敵射程 / 緑＝自分射程（Lvで伸びる）</div>
      </div>

      <div class="card">
        <div class="row">
          <b>プレイヤー</b>
          <span id="pStat"></span>
        </div>
        <div class="bar"><div id="pBar"></div></div>
      </div>

      <div class="card">
        <div class="row">
          <b>敵</b>
          <span id="eStat"></span>
        </div>
        <div class="bar red"><div id="eBar"></div></div>
        <div class="hint" id="battleState" style="margin-top:8px;"></div>
      </div>

      <!-- 追加：ログ -->
      <div class="card">
        <div class="row">
          <b>ログ</b>
          <button id="clearLogBtn" class="btn">クリア</button>
        </div>
        <div id="log" class="log"></div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
